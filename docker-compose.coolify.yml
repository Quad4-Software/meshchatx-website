# Coolify compose for MeshChatX website.
# Use this file as the Coolify Docker Compose build pack.
# Proxy via SERVICE_URL_WEB_8080 (web listens on 8080).
# Optional public API via SERVICE_URL_API_8090 (api listens on 8090).
# No host port publish.
# Assign the public site domain ONLY to the web service as https://meshchatx.com:8080
# Do not define custom networks. Coolify creates one per stack and attaches its proxy to it.
# Images: ghcr.io/quad4-software/meshchatx-website/web and .../api (zstd OCI layers).

name: meshchatx-website

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-latest}
        BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-quad4}
        BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-https://ny.storage.bunnycdn.com}
        BUNNY_CDN_BASE: ${BUNNY_CDN_BASE:-https://cdn.quad4.io}
        BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY:-}
    image: ghcr.io/quad4-software/meshchatx-website/web:${VERSION:-latest}
    init: true
    restart: unless-stopped
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=16m
    expose:
      - "8080"
    environment:
      SERVICE_URL_WEB_8080: ${SERVICE_URL_WEB_8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ghcr.io/quad4-software/meshchatx-website/api:${VERSION:-latest}
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777,size=8m
    expose:
      - "8090"
    environment:
      ADDR: ":8090"
      SERVICE_URL_API_8090: ${SERVICE_URL_API_8090:-}
      CDN_BASE: ${CDN_BASE:-https://cdn.quad4.io}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-quad4}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-https://ny.storage.bunnycdn.com}
      BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY:-}
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M
