---
- name: Install lighttpd
  ansible.builtin.package:
    name: lighttpd
    state: present

- name: Create site root
  ansible.builtin.file:
    path: "{{ meshchatx_web_root }}"
    state: directory
    owner: "{{ meshchatx_web_user }}"
    group: "{{ meshchatx_web_group }}"
    mode: "0755"

- name: Create lighttpd log directory
  ansible.builtin.file:
    path: /var/log/lighttpd
    state: directory
    owner: "{{ meshchatx_web_user }}"
    group: "{{ meshchatx_web_group }}"
    mode: "0750"

- name: Sync built site
  ansible.builtin.copy:
    src: "{{ meshchatx_web_dist }}/"
    dest: "{{ meshchatx_web_root }}/"
    owner: "{{ meshchatx_web_user }}"
    group: "{{ meshchatx_web_group }}"
    mode: preserve
    directory_mode: "0755"

- name: Install lighttpd config
  ansible.builtin.template:
    src: lighttpd.conf.j2
    dest: /etc/lighttpd/lighttpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload lighttpd

- name: Check lighttpd config
  ansible.builtin.command:
    cmd: lighttpd -t -f /etc/lighttpd/lighttpd.conf
  changed_when: false

- name: Start lighttpd
  ansible.builtin.service:
    name: lighttpd
    state: started
    enabled: true

- name: Run site API container
  when: meshchatx_web_api_enabled
  community.docker.docker_container:
    name: "{{ meshchatx_web_api_container }}"
    image: "{{ meshchatx_web_api_image }}"
    state: started
    restart_policy: unless-stopped
    read_only: true
    user: "65532:65532"
    capabilities:
      drop:
        - ALL
    security_opts:
      - no-new-privileges:true
    published_ports:
      - "{{ meshchatx_web_api_bind }}:{{ meshchatx_web_api_port }}:8090"
    env:
      ADDR: ":8090"
      CDN_BASE: "{{ meshchatx_web_cdn_base }}"
      BUNNY_STORAGE_ZONE: "{{ meshchatx_web_bunny_storage_zone }}"
      BUNNY_STORAGE_ENDPOINT: "{{ meshchatx_web_bunny_storage_endpoint }}"
      BUNNY_STORAGE_ACCESS_KEY: "{{ meshchatx_web_bunny_storage_access_key }}"
    tmpfs:
      - /tmp:noexec,nosuid,size=8m
