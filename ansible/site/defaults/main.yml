---
# Static site + optional API container.

meshchatx_web_domain: meshchatx.com
meshchatx_web_root: /var/www/meshchatx
meshchatx_web_dist: "{{ playbook_dir }}/../dist"
meshchatx_web_listen: 80
meshchatx_web_user: www-data
meshchatx_web_group: www-data

meshchatx_web_api_enabled: false
meshchatx_web_api_image: meshchatx-siteapi:local
meshchatx_web_api_container: meshchatx-siteapi
meshchatx_web_api_bind: "127.0.0.1"
meshchatx_web_api_port: 8090
meshchatx_web_cdn_base: https://cdn.quad4.io
meshchatx_web_bunny_storage_zone: quad4
meshchatx_web_bunny_storage_endpoint: https://ny.storage.bunnycdn.com
meshchatx_web_bunny_storage_access_key: ""
