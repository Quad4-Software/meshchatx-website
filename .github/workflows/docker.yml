# Build and publish multi-arch images to GHCR with zstd OCI layers.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Docker

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # clone the repo
      packages: write # push images to GHCR
      attestations: write # attach image provenance
      id-token: write # keyless Cosign OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            file: ./Dockerfile
            context: .
          - target: api
            file: ./api/Dockerfile
            context: ./api
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          owner_repo="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner_repo}/${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Build stamp
        id: stamp
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          created="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          build-args: |
            BUILD_DATE=${{ steps.stamp.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.stamp.outputs.version }}

      - name: Build and push (GHCR, zstd layers)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          build-args: |
            BUILD_DATE=${{ steps.stamp.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.stamp.outputs.version }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Cosign sign (keyless, GHCR)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "${IMAGE_DIGEST}"
          cosign sign "${IMAGE_NAME}@${IMAGE_DIGEST}"
