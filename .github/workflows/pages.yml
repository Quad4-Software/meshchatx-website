# GitHub Pages preview deploy for master
# Least privilege, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # clone the repo
      pages: write # deploy to GitHub Pages
      id-token: write # Pages OIDC deployment token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The CNAME file lives only in this artifact so production dist/ stays
      # untouched. Requires a preview.meshchatx.com CNAME record pointing at
      # quad4-software.github.io and Pages set to GitHub Actions deploys.
      - name: Write Pages CNAME
        run: echo "preview.meshchatx.com" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
