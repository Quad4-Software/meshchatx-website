# GitHub Pages deploy for meshchatx.com.
# Rebuilds and redeploys on push, on a timer, on demand, or when the app
# repo sends a release-published repository_dispatch event. Timed and
# dispatched runs skip the deploy when the live baked JSON already matches.
# Least privilege, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Pages

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  LIVE_API: https://meshchatx.com/api/releases.json
  LIVE_INTERFACES: https://meshchatx.com/api/interfaces.json

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # clone the repo
      pages: write # deploy to GitHub Pages
      id-token: write # Pages OIDC deployment token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The CNAME file lives only in this artifact so repo files stay
      # untouched. Requires meshchatx.com DNS pointing at
      # quad4-software.github.io and Pages set to GitHub Actions deploys.
      - name: Write Pages CNAME
        run: echo "meshchatx.com" > dist/CNAME

      # Pushes always deploy; timer and dispatch runs only deploy when the
      # live baked API payloads differ from what this build produced.
      - name: Skip deploy when live data matches
        if: github.event_name != 'push'
        id: check
        run: |
          stale=0
          for pair in "dist/api/releases.json $LIVE_API" "dist/api/interfaces.json $LIVE_INTERFACES"; do
            set -- $pair
            live=$(curl -fsS --max-time 15 "$2" | sha256sum | cut -d' ' -f1) || live=fetch-failed
            baked=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$1 baked=$baked live=$live"
            [ "$live" = "$baked" ] || stale=1
          done
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: github.event_name == 'push' || steps.check.outputs.stale == '1'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' || steps.check.outputs.stale == '1'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to Pages
        if: github.event_name == 'push' || steps.check.outputs.stale == '1'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
