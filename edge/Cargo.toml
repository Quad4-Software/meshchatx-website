[package]
name = "meshchatx-edge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
miniz_oxide = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wstd = "0.6"

[build-dependencies]
anyhow = "1"
brotli = "9"
flate2 = "1"

# build.rs compresses all of dist/; keep it fast under cargo test too.
[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
strip = true
