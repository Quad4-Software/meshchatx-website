name: meshchatx-website

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-local}
    image: meshchatx-website-web:${VERSION:-local}
    init: true
    restart: unless-stopped
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=16m
    ports:
      - target: 8080
        published: ${HTTP_PORT:-8080}
        protocol: tcp
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: meshchatx-website-api:${VERSION:-local}
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777,size=8m
    ports:
      - target: 8090
        published: ${API_PORT:-8090}
        protocol: tcp
    networks:
      - edge
    environment:
      ADDR: ":8090"
      CDN_BASE: ${CDN_BASE:-https://cdn.quad4.io}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-quad4}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-https://ny.storage.bunnycdn.com}
      BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY:-}
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  edge:
    driver: bridge
