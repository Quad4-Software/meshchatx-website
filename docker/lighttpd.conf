server.document-root = "/var/www/html"
server.bind = "0.0.0.0"
server.port = 8080
server.pid-file = "/tmp/lighttpd.pid"
server.errorlog = "/dev/stderr"
server.tag = ""

index-file.names = ("index.html")
dir-listing.activate = "disable"
url.access-deny = ("~", ".inc")
static-file.exclude-extensions = (".php", ".pl", ".cgi", ".fcgi")

server.modules = (
  "mod_setenv",
  "mod_rewrite",
  "mod_access",
  "mod_expire",
  "mod_deflate",
  "mod_accesslog"
)

accesslog.filename = "/dev/stdout"

mimetype.assign = (
  ".html" => "text/html",
  ".css" => "text/css",
  ".js" => "text/javascript",
  ".mjs" => "text/javascript",
  ".json" => "application/json",
  ".xml" => "application/xml",
  ".txt" => "text/plain",
  ".svg" => "image/svg+xml",
  ".webp" => "image/webp",
  ".png" => "image/png",
  ".jpg" => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif" => "image/gif",
  ".ico" => "image/x-icon",
  ".woff" => "font/woff",
  ".woff2" => "font/woff2",
  ".ttf" => "font/ttf",
  ".map" => "application/json",
  ".webmanifest" => "application/manifest+json",
  ".avif" => "image/avif",
  "" => "application/octet-stream"
)

deflate.mimetypes = (
  "text/html",
  "text/plain",
  "text/css",
  "text/javascript",
  "application/javascript",
  "application/json",
  "application/xml",
  "image/svg+xml"
)

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "Referrer-Policy" => "no-referrer",
  "X-Frame-Options" => "SAMEORIGIN"
)

$HTTP["url"] =~ "^/_astro/" {
  expire.url = ( "" => "access plus 1 year" )
  setenv.set-response-header = (
    "Cache-Control" => "public, max-age=31536000, immutable"
  )
}
else $HTTP["url"] =~ ".*" {
  # Nothing else is content-hashed, so cap freshness short enough that a
  # redeploy (new release version, changelog, interfaces) propagates fast.
  expire.url = ( "" => "access plus 5 minutes" )
  setenv.set-response-header = (
    "Cache-Control" => "public, max-age=300"
  )
}

url.rewrite-if-not-file = (
  "^(/[^?]+[^/?])" => "$1/index.html"
)

server.errorfile-prefix = "/var/www/html/"
