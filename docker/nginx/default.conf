# Serve precompressed .br sidecars (built in the frontend stage) to clients
# that accept brotli. The image ships no brotli module, so a rewrite inside
# each static location internally redirects to the .br URI when the client
# accepts br and the sidecar exists; the .br locations below then set
# Content-Encoding and the inner content type.
map $http_accept_encoding $want_br {
    default 0;
    "~*\bbr\b" 1;
}

map $uri $br_cache_control {
    default    "public, max-age=2592000";
    ~^/build/  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 8m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # default_type takes no variables, so .br sidecars are served from
    # per-type locations reached via the rewrite in the static locations.
    location ~ \.css\.br$ {
        internal;
        gzip off;
        default_type text/css;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.(?:js|mjs)\.br$ {
        internal;
        gzip off;
        default_type application/javascript;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.(?:map|json)\.br$ {
        internal;
        gzip off;
        default_type application/json;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.svg\.br$ {
        internal;
        gzip off;
        default_type image/svg+xml;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.webmanifest\.br$ {
        internal;
        gzip off;
        default_type application/manifest+json;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.txt\.br$ {
        internal;
        gzip off;
        default_type text/plain;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ \.br$ {
        internal;
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control $br_cache_control always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ ^/build/ {
        set $br_file "";
        if ($want_br = 1) { set $br_file "$document_root$uri.br"; }
        if (-f $br_file) { rewrite ^ $uri.br last; }
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /showcase/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|webmanifest)$ {
        set $br_file "";
        if ($want_br = 1) { set $br_file "$document_root$uri.br"; }
        if (-f $br_file) { rewrite ^ $uri.br last; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|composer\.(json|lock)|package(-lock)?\.json|artisan) {
        deny all;
    }
}
